name: Build Mac Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build Mac Application
        run: |
          pyinstaller --onefile --windowed \
            --name "Gestion_Stock_Pneus" \
            --add-data "stock_pneus.json:." \
            --add-data "mouvements_stock.json:." \
            gestion_pneus.py

      - name: Upload App
        uses: actions/upload-artifact@v4
        with:
          name: Gestion_Stock_Pneus_Mac
          path: dist/Gestion_Stock_Pneus.app
